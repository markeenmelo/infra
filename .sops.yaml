keys:
  - &operator age1vxf38fcnxh2v5razwzrlknljxja76jnt9gxxvnjwrun29h5cgymq297mht
  - &bastion age16fyy8678zedgm6nqgqnvmwzlc9cjzsc2nu9u45jaxvuh0sw5wfjst73np2
  - &edge age1wp59wfdt35kt2nu4w7ufepqmw44qpe3f79u8h46rz74jp2y95d3q4defmp
  - &thinkpad age133p0p8m0aecjw92dg8unslruhfhsupq68juht0m5j8p6xwcyp9gse344fz

creation_rules:
  - path_regex: ^secrets/hosts/edge\.yaml$
    key_groups:
      - age:
          - *operator
          - *edge
  - path_regex: ^secrets/hosts/bastion\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
  - path_regex: ^secrets/hosts/thinkpad\.yaml$
    key_groups:
      - age:
          - *operator
          - *thinkpad
  - path_regex: ^secrets/shared/login\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
          - *thinkpad
  - path_regex: ^secrets/shared/crowdsec\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
          - *edge
  - path_regex: ^secrets/tailscale/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/unifi/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/porkbun/api\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
  - path_regex: ^secrets/oracle/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/porkbun/operator\.yaml$
    key_groups:
      - age:
