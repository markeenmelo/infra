keys:
  - &operator age1vxf38fcnxh2v5razwzrlknljxja76jnt9gxxvnjwrun29h5cgymq297mht
  - &racknerd age1qd9jj98f3wt0x6g6j5xme6xajhk24kpnl0hasd2pe7uenxhfcypqsyhp2k
  - &bastion age16fyy8678zedgm6nqgqnvmwzlc9cjzsc2nu9u45jaxvuh0sw5wfjst73np2
  - &mac age193u7atdy24w87fgf3csypv7zam5qkeelxt9xewwl9w9e8vze4ddss8yy6v
  - &thinkpad age1uyv2jhru0fyy63ae3rwvzx4gzd42k8v0hl2rvjpaz6fqr5qhs5fshqat7p

creation_rules:
  - path_regex: ^secrets/hosts/racknerd\.yaml$
    key_groups:
      - age:
          - *operator
          - *racknerd
  - path_regex: ^secrets/hosts/bastion\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
  - path_regex: ^secrets/hosts/thinkpad(-senecanet)?\.yaml$
    key_groups:
      - age:
          - *operator
          - *thinkpad
  - path_regex: ^secrets/hosts/mac\.yaml$
    key_groups:
      - age:
          - *operator
          - *mac
  - path_regex: ^secrets/shared/login\.yaml$
    key_groups:
      - age:
          - *operator
          - *racknerd
          - *bastion
          - *thinkpad
  - path_regex: ^secrets/tailscale/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/unifi/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/porkbun/api\.yaml$
    key_groups:
      - age:
          - *operator
          - *racknerd
          - *bastion
  - path_regex: ^secrets/porkbun/operator\.yaml$
    key_groups:
      - age:
          - *operator
