creation_rules:
  - path_regex: ^secrets/hosts/racknerd\.yaml$
    key_groups:
      - age:
          - *operator
          - *racknerd
  - path_regex: ^secrets/hosts/bastion\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
  - path_regex: ^secrets/hosts/thinkpad(-senecanet)?\.yaml$
    key_groups:
      - age:
          - *operator
          - *thinkpad
  - path_regex: ^secrets/hosts/asahi(-senecanet)?\.yaml$
    key_groups:
      - age:
          - *operator
          - *asahi
  - path_regex: ^secrets/hosts/mac\.yaml$
    key_groups:
      - age:
          - *operator
          - *mac
  - path_regex: ^secrets/shared/login\.yaml$
    key_groups:
      - age:
          - *operator
          - *thinkpad
          - *asahi
  - path_regex: ^secrets/shared/mcp\.yaml$
    key_groups:
      - age:
          - *operator
          - *mac
          - *thinkpad
          - *asahi
  - path_regex: ^secrets/tailscale/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/unifi/operator\.yaml$
    key_groups:
      - age:
          - *operator
  - path_regex: ^secrets/porkbun/api\.yaml$
    key_groups:
      - age:
          - *operator
          - *bastion
  - path_regex: ^secrets/porkbun/operator\.yaml$
    key_groups:
      - age:
          - *operator
