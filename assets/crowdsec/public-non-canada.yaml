name: fleet/public-non-canada
description: Reactive public-web ban outside Canada, including unknown GeoIP
# Private clients are excluded here only, never in a parser or global allowlist.
filter: |
  evt.Meta.log_type == 'http_access-log' &&
  evt.Parsed.program startsWith 'traefik' &&
  (IsIPV4(evt.Meta.source_ip) || IsIPV6(evt.Meta.source_ip)) &&
  !any(['0.0.0.0/8', '10.0.0.0/8', '100.64.0.0/10', '127.0.0.0/8',
        '169.254.0.0/16', '172.16.0.0/12', '192.0.0.0/24', '192.0.2.0/24',
        '192.168.0.0/16', '198.18.0.0/15', '198.51.100.0/24', '203.0.113.0/24',
        '224.0.0.0/4', '240.0.0.0/4', '::/128', '::1/128',
        '64:ff9b::/96', '64:ff9b:1::/48', '100::/64', '2001:db8::/32',
        'fc00::/7', 'fe80::/10', 'ff00::/8'], { IpInRange(evt.Meta.source_ip, #) }) &&
  ('IsoCode' not in evt.Enriched || evt.Enriched.IsoCode != 'CA')
type: trigger
groupby: evt.Meta.source_ip
blackhole: 5m
labels:
  service: http
  type: policy
  remediation: true
  confidence: 3
  spoofable: 0
  label: Public web outside Canada
