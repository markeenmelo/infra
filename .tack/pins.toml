[inputs.caveman]
url = "github:JuliusBrussee/caveman"
tag = "v{version}"
type = "fetch"

[inputs.claude-plugins-official]
url = "github:anthropics/claude-plugins-official"
type = "fetch"

[inputs.decluttarr]
url = "github:ManiMatter/decluttarr"
type = "fetch"
tag = "v{version}"

[inputs.deploy-rs]
url = "github:serokell/deploy-rs"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs" }
omit_inputs = ["flake-compat"]

[inputs.disko]
# shortcut: v1.13.0 hangs the disko VM tests against nixos-unstable, add tag = "v{version}" once a newer release passes the storage checks
url = "github:nix-community/disko"
follows = { nixpkgs = "nixpkgs" }

[inputs.dorian]
url = "github:markeenmelo/Cthulu-Dice-Roller"
type = "fetch"

[inputs.easynews-indexer]
url = "github:Sanket9225/Easynews_as_indexer"
type = "fetch"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"
follows = { nixpkgs-lib = "nixpkgs" }

[inputs.hermes-agent]
# shortcut: upstream's older v2026.* date tags outrank v0.x under v{version}, widen the template once it releases past 0.x
url = "github:NousResearch/hermes-agent"
tag = "v0.{version}"
follows = { flake-parts = "flake-parts", home-manager = "home-manager" }

[inputs.home-manager]
url = "github:nix-community/home-manager"
follows = { nixpkgs = "nixpkgs" }

[inputs.import-tree]
url = "github:denful/import-tree"
tag = "v{version}"

[inputs.just-lsp]
url = "github:terror/just-lsp"
tag = "{version}"
follows = { nixpkgs = "nixpkgs" }

[inputs.luciole]
url = "github:noctalia-dev/luciole"
follows = { nixpkgs = "nixpkgs" }

[inputs.mcp-nixos]
url = "github:utensils/mcp-nixos"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs", flake-parts = "flake-parts" }

[inputs.microvm]
url = "github:microvm-nix/microvm.nix"
follows = { nixpkgs = "nixpkgs" }
omit_inputs = ["spectrum"]

[inputs.nh]
url = "github:nix-community/nh"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs" }

[inputs.nix-minecraft]
url = "github:Infinidoge/nix-minecraft"
type = "fetch"

[inputs.nix-update]
url = "github:Mic92/nix-update"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs" }

[inputs.nixflix]
# shortcut: v6.0.0 lacks the arr host config merge fix #302 follows main for, add tag = "v{version}" once a later release carries it
url = "github:kiriwalawren/nixflix"
follows = { nixpkgs = "nixpkgs" }
omit_inputs = ["mkdocs-catppuccin", "treefmt-nix"]

[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.noctalia-greeter]
url = "github:noctalia-dev/noctalia-greeter"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs" }

[inputs.noctalia]
url = "github:noctalia-dev/noctalia"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs" }

[inputs.paseo]
url = "github:getpaseo/paseo"
tag = "v{version}"
omit_inputs = ["nixpkgs"]

[inputs.ponytail]
url = "github:DietrichGebert/ponytail"
tag = "v{version}"
type = "fetch"

[inputs.preservation]
url = "github:nix-community/preservation"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"
follows = { nixpkgs = "nixpkgs" }

[inputs.stylix]
url = "github:nix-community/stylix"
follows = { flake-parts = "flake-parts", nixpkgs = "nixpkgs" }

[inputs.tack]
url = "github:manic-systems/tack"
tag = "v{version}"
follows = { nixpkgs = "nixpkgs" }
omit_inputs = ["fenix"]

[inputs.trailofbits-skills]
url = "github:trailofbits/skills"
type = "fetch"

[inputs.umbriel]
url = "github:noctalia-dev/umbriel"
follows = { nixpkgs = "nixpkgs", xdg-desktop-portal-umbriel = "xdg-desktop-portal-umbriel" }

[inputs.xdg-desktop-portal-umbriel]
url = "github:noctalia-dev/xdg-desktop-portal-umbriel"
follows = { nixpkgs = "nixpkgs" }

[inputs.zen-browser]
url = "github:0xc000022070/zen-browser-flake"
follows = { home-manager = "home-manager", nixpkgs = "nixpkgs" }
