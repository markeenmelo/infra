name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: accept-flake-config = false
      - name: Copy the Hermes source into the store, which the read-only evaluation below reads and cannot add
        run: nix eval --raw .#nixosConfigurations.bastion.config.microvm.vms.hermes.config.config.services.hermes-agent.package.drvPath
      - run: nix flake check --all-systems --no-build --option allow-import-from-derivation false
      - name: Validate the OpenTofu projects against their locked providers
        run: |
          for project in opentofu/*/; do
            nix shell --inputs-from . nixpkgs#opentofu --command sh -c \
              'tofu -chdir="$1" init -backend=false -input=false -lockfile=readonly && tofu -chdir="$1" validate' _ "$project"
          done

  linux:
    needs: eval
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let Nix use KVM for the storage VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: accept-flake-config = false
      - name: List the checks whose derivation differs from the base commit's
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          drvs() { nix eval --json "$1#checks.x86_64-linux" --apply 'builtins.mapAttrs (_: check: check.drvPath)'; }
          drvs . > "$RUNNER_TEMP/head.json"
          if [ -n "$BASE" ]; then
            drvs "github:$GITHUB_REPOSITORY/$BASE" > "$RUNNER_TEMP/base.json" || echo '{}' > "$RUNNER_TEMP/base.json"
          else
            echo '{}' > "$RUNNER_TEMP/base.json"
          fi
          jq -rn --slurpfile head "$RUNNER_TEMP/head.json" --slurpfile base "$RUNNER_TEMP/base.json" \
            '$head[0] | to_entries[] | select($base[0][.key] != .value) | ".#checks.x86_64-linux." + .key' \
            > "$RUNNER_TEMP/checks"
          echo "$(wc -l < "$RUNNER_TEMP/checks") of $(jq length "$RUNNER_TEMP/head.json") checks to build:"
          cat "$RUNNER_TEMP/checks"
      - name: Fetch what cache.nixos.org holds
        run: xargs -r -a "$RUNNER_TEMP/checks" nix build --no-link --keep-going --max-jobs 0 || true
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        id: tailnet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci
          log-mode: quiet
      - name: Fetch what bastion's Harmonia cache holds
        if: steps.tailnet.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        run: |
          settings=$(nix eval --json .#nixosConfigurations.thinkpad.config.nix.settings \
            --apply 's: { inherit (s) substituters trusted-public-keys; }')
          xargs -r -a "$RUNNER_TEMP/checks" nix build --no-link --keep-going --max-jobs 0 \
            --option substituters "$(jq -r '.substituters | join(" ")' <<< "$settings")" \
            --option trusted-public-keys "$(jq -r '."trusted-public-keys" | join(" ")' <<< "$settings")" || true
      - name: Leave the tailnet before building
        if: steps.tailnet.outcome == 'success'
        run: sudo tailscale logout
      - name: Build them
        run: xargs -r -a "$RUNNER_TEMP/checks" nix build --no-link --keep-going --print-build-logs
