name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let Nix use KVM for the storage VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - run: nix flake check --all-systems --no-build --option allow-import-from-derivation false
      - name: Fetch what cache.nixos.org holds
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames |
            jq -r '.[] | ".#checks.x86_64-linux." + .' > "$RUNNER_TEMP/checks"
          xargs -a "$RUNNER_TEMP/checks" nix build --no-link --keep-going --max-jobs 0 || true
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        id: tailnet
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci
          log-mode: quiet
      - name: Fetch what bastion's Harmonia cache holds
        if: steps.tailnet.outcome == 'success'
        run: |
          settings=$(nix eval --json .#nixosConfigurations.racknerd.config.nix.settings \
            --apply 's: { inherit (s) substituters trusted-public-keys; }')
          xargs -a "$RUNNER_TEMP/checks" nix build --no-link --keep-going --max-jobs 0 \
            --option substituters "$(jq -r '.substituters | join(" ")' <<< "$settings")" \
            --option trusted-public-keys "$(jq -r '."trusted-public-keys" | join(" ")' <<< "$settings")" || true
      - name: Leave the tailnet before building
        if: steps.tailnet.outcome == 'success'
        run: sudo tailscale logout
      - run: nix flake check --print-build-logs

  darwin:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - run: nix flake check --print-build-logs
