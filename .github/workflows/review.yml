name: review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  claude:
    name: claude-code (fable)
    if: >-
      github.event.sender.type != 'Bot' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: review-fable-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: claude
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          classify_inline_comments: "false"
          settings: '{"permissions":{"deny":["Read(//proc/**)","Read(~/.claude/**)"],"blockReadsOutsideWorkingDirectories":true}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following the "Review guidelines" section of CLAUDE.md.
            The working directory holds the trusted base branch, not the PR; read the PR only
            through `gh pr diff` and `gh pr view`; `Read`, `Glob` and `Grep` work on the base
            checkout. Bash is limited to those two commands; the inline comment and structured
            output tools are the only others, and any other call is denied.
            Return the top-level summary as the `summary` field of your structured output and
            post line-specific findings with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`),
            starting every inline comment body with the line `**fable**`.
            Post nothing else. Return the summary even if you run short of turns.
          claude_args: >-
            --model claude-fable-5-2
            --effort medium
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Agent,Task"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'
      - if: steps.claude.outputs.structured_output != ''
        run: |
          body=${SUMMARY:?}
          for name in REVIEW_KEY GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            [ -z "${!name-}" ] || [[ $body != *"${!name}"* ]] || {
              echo "the summary contains the value of $name" >&2
              exit 1
            }
          done
          body="$MARKER"$'\n'"**fable**"$'\n\n'"$body"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body="$body"
          fi
        env:
          REVIEW_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: <!-- fable-review -->
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output || '{}').summary }}
